<title>Ledger &amp; Signal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#e9edf3; --surface:#fff; --surface-2:#f4f7fa; --surface-3:#eaeff5;
  --ink:#0d141d; --ink-soft:#4a5666; --ink-faint:#7b8798;
  --line:#dae1ea; --line-soft:#e8edf3;
  --accent:#3d4fd4; --accent-wash:rgba(61,79,212,.09);
  --dem:#2a78d6; --gop:#d03b3b; --ind:#8a5d00;
  --live:#0ca30c; --live-wash:rgba(12,163,12,.10);
  --blocked:#d03b3b; --blocked-wash:rgba(208,59,59,.10);
  --pend:#b07908; --pend-wash:rgba(176,121,8,.12);
  --shadow:0 1px 2px rgba(13,20,29,.05),0 4px 12px rgba(13,20,29,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#080c11; --surface:#121821; --surface-2:#19212c; --surface-3:#1f2833;
  --ink:#e3eaf2; --ink-soft:#94a2b3; --ink-faint:#697787;
  --line:#212b38; --line-soft:#1a222d;
  --accent:#8494ff; --accent-wash:rgba(132,148,255,.13);
  --dem:#3987e5; --gop:#f0736c; --ind:#dcae57;
  --live:#22c55e; --live-wash:rgba(34,197,94,.13);
  --blocked:#f0736c; --blocked-wash:rgba(240,115,108,.13);
  --pend:#fab219; --pend-wash:rgba(250,178,25,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#080c11; --surface:#121821; --surface-2:#19212c; --surface-3:#1f2833;
  --ink:#e3eaf2; --ink-soft:#94a2b3; --ink-faint:#697787;
  --line:#212b38; --line-soft:#1a222d;
  --accent:#8494ff; --accent-wash:rgba(132,148,255,.13);
  --dem:#3987e5; --gop:#f0736c; --ind:#dcae57;
  --live:#22c55e; --live-wash:rgba(34,197,94,.13);
  --blocked:#f0736c; --blocked-wash:rgba(240,115,108,.13);
  --pend:#fab219; --pend-wash:rgba(250,178,25,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
a{color:var(--accent)}

.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.5rem;margin-right:auto}
.brand b{font-size:1.02rem;font-weight:700;letter-spacing:-.02em}
.brand .sub{font-family:"JetBrains Mono",monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.search{position:relative;flex:1 1 200px;max-width:280px}
.search input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:.42rem .6rem .42rem 1.9rem;font-size:.85rem;font-family:inherit}
.search input::placeholder{color:var(--ink-faint)}
.search svg{position:absolute;left:.55rem;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink-faint);fill:none;stroke-width:2}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{font-family:"JetBrains Mono",monospace;font-size:.68rem;padding:.3rem .55rem;border-radius:4px;color:var(--ink-soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.tabs{max-width:1240px;margin:0 auto;padding:0 1.25rem;display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:.6rem .05rem;margin-right:1.35rem;font-size:.87rem;font-weight:600;color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--ink-faint);margin-left:.3rem}
main{max-width:1240px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
@media(max-width:560px){.top-in{padding:.6rem .85rem}.tabs{padding:0 .85rem}main{padding:1.1rem .85rem 3rem}}

h2.sec{font-size:1.05rem;font-weight:700;letter-spacing:-.015em;margin:0 0 .15rem}
.sec-note{font-size:.83rem;color:var(--ink-soft);margin:0 0 .9rem;max-width:74ch}
.rowgap{display:flex;flex-direction:column;gap:1.5rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.8rem .9rem}
.tile .lab{font-family:"JetBrains Mono",monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:.35rem}
.tile .val{font-family:"JetBrains Mono",monospace;font-size:1.5rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.tile .foot{font-size:.73rem;color:var(--ink-soft);margin-top:.2rem}

.chip{display:inline-flex;align-items:center;gap:.3em;font-family:"JetBrains Mono",monospace;font-size:.65rem;font-weight:500;padding:.2em .5em;border-radius:4px;white-space:nowrap;border:1px solid transparent}
.chip.plain{background:var(--surface-2);color:var(--ink-soft);border-color:var(--line)}
.chip.acc{background:var(--accent-wash);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.live{background:var(--live-wash);color:var(--live);border-color:color-mix(in srgb,var(--live) 30%,transparent)}
.chip.blocked{background:var(--blocked-wash);color:var(--blocked);border-color:color-mix(in srgb,var(--blocked) 30%,transparent)}
.chip.pend{background:var(--pend-wash);color:var(--pend);border-color:color-mix(in srgb,var(--pend) 32%,transparent)}
.pty{display:inline-block;width:3px;height:1.05em;border-radius:2px;vertical-align:-.15em;margin-right:.45em}
.pty.D{background:var(--dem)}.pty.R{background:var(--gop)}.pty.I{background:var(--ind)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:600px}
th,td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
thead th{font-family:"JetBrains Mono",monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:400;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-2)}
th.r,td.r{text-align:right}
.ename{font-weight:600;display:block;line-height:1.25}
.erole{font-size:.72rem;color:var(--ink-faint);display:block;line-height:1.3}

.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.7rem}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.85rem .9rem;text-align:left;display:flex;flex-direction:column;gap:.5rem;width:100%;transition:border-color .12s,transform .12s}
.ecard:hover{border-color:var(--accent);transform:translateY(-1px)}
.ecard .nm{font-weight:600;font-size:.92rem;line-height:1.25}
.ecard .rl{font-size:.73rem;color:var(--ink-faint);margin-top:.08rem}
.ecard .ft{display:flex;flex-wrap:wrap;gap:.3rem;border-top:1px solid var(--line-soft);padding-top:.5rem;margin-top:auto}

.back{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;color:var(--ink-soft);font-family:"JetBrains Mono",monospace;margin-bottom:.9rem}
.back:hover{color:var(--accent)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.dhead h1{font-size:1.65rem;font-weight:700;letter-spacing:-.028em;margin:0 0 .2rem;text-wrap:balance}
.dhead .dsub{font-size:.86rem;color:var(--ink-soft)}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem;align-items:start}
@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:1rem 1.1rem}
.panel h3{font-size:.83rem;font-weight:700;margin:0 0 .12rem}
.panel .ph{font-size:.76rem;color:var(--ink-faint);margin:0 0 .8rem;line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line-soft);font-size:.82rem}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-soft)}
.kv .v{font-family:"JetBrains Mono",monospace;font-weight:500;text-align:right}
.clist{display:flex;flex-direction:column;gap:.4rem}
.crow{display:flex;justify-content:space-between;gap:.7rem;align-items:baseline;padding:.45rem .6rem;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:6px;font-size:.82rem;width:100%;text-align:left}
.crow:hover{border-color:var(--accent)}
.crow .cn{line-height:1.3}

.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;padding:.85rem 1rem}
.note b{display:block;font-family:"JetBrains Mono",monospace;font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem}
.note p{margin:0 0 .5rem;font-size:.83rem;color:var(--ink-soft);line-height:1.55;max-width:80ch}
.note p:last-child{margin-bottom:0}
.note.warn{border-left-color:var(--pend)} .note.warn b{color:var(--pend)}

.pending{border:1px dashed var(--line);border-radius:9px;padding:1.2rem;text-align:center;background:repeating-linear-gradient(135deg,transparent,transparent 7px,var(--surface-2) 7px,var(--surface-2) 14px)}
.pending .pt{font-family:"JetBrains Mono",monospace;font-size:.9rem;color:var(--ink-soft);font-weight:500;margin-bottom:.35rem}
.pending p{font-size:.8rem;color:var(--ink-faint);max-width:52ch;margin:0 auto;line-height:1.55}

.bar{height:8px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:.25rem}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.foot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--ink-faint);line-height:1.7}
.fade-in{animation:fi .18s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Ledger &amp; Signal</b><span class="sub">Congressional Jurisdiction Index</span></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search members, states, committees&hellip;" aria-label="Search"></div>
    <div class="seg" id="ch" role="group" aria-label="Chamber"></div>
    <div class="seg" id="pt" role="group" aria-label="Party"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="app"></main>

<script id="payload" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('payload').textContent);
const MEM = DATA.members, CMTE = DATA.committees;
const cmteById = Object.fromEntries(CMTE.map(c=>[c.id,c]));

/* sectors, derived from real committee jurisdiction */
const SECTORS = [...new Set(CMTE.flatMap(c=>c.sectors))].sort();
const sectorMembers = s => MEM.filter(m=>m.sectors.includes(s));

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P = p => p==='Democrat'?'D':p==='Republican'?'R':'I';
const chamberName = c => c==='sen'?'Senator':'Representative';
const seat = m => m.chamber==='sen' ? `${m.state}` : `${m.state}-${m.district??'AL'}`;
const YEAR = new Date().getFullYear();

const S={view:'sectors', mid:null, sec:null, cid:null, ch:'all', pt:'all', q:''};
const CH=[['all','All'],['sen','Senate'],['rep','House']];
const PT=[['all','All'],['Democrat','Dem'],['Republican','Rep']];
const TABS=[['sectors','Sectors'],['members','Members'],['committees','Committees'],['sources','Data sources']];

function filt(list){
  const q=S.q.trim().toLowerCase();
  return list.filter(m=>{
    if(S.ch!=='all' && m.chamber!==S.ch) return false;
    if(S.pt!=='all' && m.party!==S.pt) return false;
    if(!q) return true;
    return m.name.toLowerCase().includes(q) || m.state.toLowerCase()===q
      || m.committees.some(c=>c.name.toLowerCase().includes(q))
      || m.sectors.some(s=>s.toLowerCase().includes(q));
  });
}

function chrome(){
  ch.innerHTML=CH.map(([v,l])=>`<button data-ch="${v}" aria-pressed="${S.ch===v}">${l}</button>`).join('');
  pt.innerHTML=PT.map(([v,l])=>`<button data-pt="${v}" aria-pressed="${S.pt===v}">${l}</button>`).join('');
  const n=filt(MEM).length;
  tabs.innerHTML=TABS.map(([v,l])=>{
    const on = S.view===v || (v==='members'&&S.view==='member') || (v==='sectors'&&S.view==='sector') || (v==='committees'&&S.view==='committee');
    const c = v==='members'?n : v==='committees'?CMTE.length : v==='sectors'?SECTORS.length : null;
    return `<button role="tab" data-tab="${v}" aria-selected="${on}">${l}${c!=null?`<span class="cnt">${c}</span>`:''}</button>`;
  }).join('');
}

/* ---------- views ---------- */
function vSectors(){
  const list=filt(MEM);
  const rows=SECTORS.map(s=>{
    const ms=list.filter(m=>m.sectors.includes(s));
    const leads=ms.filter(m=>m.leadership.some(l=>(cmteById[l.id]?.sectors||[]).includes(s)));
    return {s,n:ms.length,leads:leads.length};
  }).sort((a,b)=>b.n-a.n);
  const max=Math.max(...rows.map(r=>r.n),1);
  return `<div class="rowgap fade-in">
    <div class="tiles">
      <div class="tile"><span class="lab">Sitting members</span><div class="val">${MEM.length}</div><div class="foot">${MEM.filter(m=>m.chamber==='sen').length} senators &middot; ${MEM.filter(m=>m.chamber==='rep').length} representatives</div></div>
      <div class="tile"><span class="lab">On a committee</span><div class="val">${MEM.filter(m=>m.committees.length).length}</div><div class="foot">of ${MEM.length} members</div></div>
      <div class="tile"><span class="lab">With sector jurisdiction</span><div class="val">${MEM.filter(m=>m.sectors.length).length}</div><div class="foot">across ${SECTORS.length} GICS sectors</div></div>
      <div class="tile"><span class="lab">Committee leadership</span><div class="val">${MEM.filter(m=>m.leadership.length).length}</div><div class="foot">chairs &amp; ranking members</div></div>
    </div>
    <div class="note"><b>What this index is for</b>
      <p>Conflict-of-interest analysis starts with a question that has nothing to do with trading: <strong>who actually
      has power over which industries?</strong> This maps every sitting member of Congress to the market sectors their
      committees hold jurisdiction over &mdash; so that when trade disclosures are ingested, each one can be classified as
      inside or outside the member's own jurisdiction.</p>
      <p>Committees with no meaningful market jurisdiction (Rules, Ethics, Budget, Foreign Affairs) are deliberately
      left unmapped rather than assigned a loose sector, because a wrong mapping manufactures false signals.</p></div>
    <div>
      <h2 class="sec">Sectors by congressional oversight</h2>
      <p class="sec-note">How many members sit on a committee with jurisdiction over each sector. Click through for the roster.</p>
      <div class="tw"><table>
        <thead><tr><th>Sector</th><th class="r">Members</th><th>Share of Congress</th><th class="r">In leadership</th></tr></thead>
        <tbody>${rows.map(r=>`<tr class="clickable" data-sec="${esc(r.s)}" tabindex="0">
          <td><span class="ename">${esc(r.s)}</span></td>
          <td class="r num">${r.n}</td>
          <td style="width:44%"><div class="bar"><i style="width:${(r.n/max*100).toFixed(1)}%"></i></div></td>
          <td class="r num">${r.leads}</td></tr>`).join('')}</tbody>
      </table></div>
    </div></div>`;
}

function vSector(){
  const s=S.sec, ms=filt(sectorMembers(s));
  const cs=CMTE.filter(c=>c.sectors.includes(s));
  const leads=ms.filter(m=>m.leadership.some(l=>(cmteById[l.id]?.sectors||[]).includes(s)));
  return `<div class="fade-in">
    <button class="back" data-back="sectors">&larr; All sectors</button>
    <div class="dhead"><div><h1>${esc(s)}</h1>
      <div class="dsub">${ms.length} members with legislative jurisdiction${leads.length?` &middot; ${leads.length} in leadership`:''}</div>
      <div class="chips">${cs.map(c=>`<span class="chip plain">${esc(c.name.replace(/^(House|Senate) (Committee on|Permanent Select Committee on|Select Committee on|Special Committee on) /,''))}</span>`).join('')}</div>
    </div></div>
    ${leads.length?`<h2 class="sec">Leadership over this sector</h2>
    <p class="sec-note">Chairs and ranking members set the agenda for these committees &mdash; the strongest form of jurisdiction.</p>
    <div class="egrid" style="margin-bottom:1.4rem">${leads.map(m=>card(m,s)).join('')}</div>`:''}
    <h2 class="sec">All members with jurisdiction</h2>
    <p class="sec-note">Every member sitting on a committee that legislates over ${esc(s).toLowerCase()}.</p>
    ${ms.length?`<div class="egrid">${ms.map(m=>card(m,s)).join('')}</div>`:empty('No members match','Widen the chamber or party filter.')}
  </div>`;
}

function card(m,hi){
  const rel = hi ? m.committees.filter(c=>(cmteById[c.id]?.sectors||[]).includes(hi)) : m.committees;
  const lead = m.leadership.filter(l=>!hi||(cmteById[l.id]?.sectors||[]).includes(hi));
  return `<button class="ecard" data-mid="${m.id}">
    <div><div class="nm"><span class="pty ${P(m.party)}"></span>${esc(m.name)}</div>
      <div class="rl">${chamberName(m.chamber)} &middot; ${seat(m)} &middot; since ${m.since}</div></div>
    <div class="ft">${lead.length?lead.map(l=>`<span class="chip acc">${esc(shortTitle(l.title))} &middot; ${esc(short(cmteById[l.id]?.name||''))}</span>`).join('')
      :rel.slice(0,2).map(c=>`<span class="chip plain">${esc(short(c.name))}</span>`).join('')}
      ${!lead.length&&rel.length>2?`<span class="chip plain">+${rel.length-2}</span>`:''}</div>
  </button>`;
}
const short = n => n.replace(/^(House|Senate) (Committee on|Permanent Select Committee on|Select Committee on|Special Committee on|Caucus on) /,'').replace(/^Joint (Committee on|Committee of Congress on) /,'Joint ').slice(0,26);
const shortTitle = s => s.replace('Vice Chairwoman','Vice Chair').replace('Vice Chairman','Vice Chair').replace('Chairwoman','Chair').replace('Chairman','Chair').replace('Ranking Member','Ranking');

function vMembers(){
  const ms=filt(MEM);
  if(!ms.length) return empty('No members match','Try clearing the search or widening the filters.');
  return `<div class="fade-in"><h2 class="sec">Sitting members of Congress</h2>
    <p class="sec-note">All ${MEM.length} current members, from the public congress-legislators dataset. Sector jurisdiction is derived from live committee rosters.</p>
    <div class="tw"><table>
      <thead><tr><th>Member</th><th>Seat</th><th class="r">Since</th><th>Committees</th><th>Sector jurisdiction</th></tr></thead>
      <tbody>${ms.map(m=>`<tr class="clickable" data-mid="${m.id}" tabindex="0">
        <td><span class="ename"><span class="pty ${P(m.party)}"></span>${esc(m.name)}</span>
            <span class="erole">${chamberName(m.chamber)}${m.leadership.length?' &middot; '+esc(m.leadership[0].title):''}</span></td>
        <td class="num">${seat(m)}</td>
        <td class="r num">${m.since}</td>
        <td class="num" style="color:var(--ink-soft)">${m.committees.length||'&mdash;'}</td>
        <td>${m.sectors.length?m.sectors.slice(0,2).map(s=>`<span class="chip plain">${esc(s)}</span>`).join(' ')+(m.sectors.length>2?` <span class="chip plain">+${m.sectors.length-2}</span>`:''):'<span style="color:var(--ink-faint)">&mdash;</span>'}</td>
      </tr>`).join('')}</tbody></table></div></div>`;
}

function vCommittees(){
  const cs=CMTE.map(c=>({...c,n:MEM.filter(m=>m.committees.some(x=>x.id===c.id)).length}));
  return `<div class="fade-in"><h2 class="sec">Committees</h2>
    <p class="sec-note">All ${CMTE.length} standing, select and joint committees. ${CMTE.filter(c=>c.sectors.length).length} carry market-sector jurisdiction; the rest are deliberately unmapped.</p>
    <div class="tw"><table>
      <thead><tr><th>Committee</th><th class="r">Members</th><th>Sector jurisdiction</th></tr></thead>
      <tbody>${cs.map(c=>`<tr class="clickable" data-cid="${c.id}" tabindex="0">
        <td><span class="ename">${esc(short(c.name))}</span><span class="erole">${esc(c.name)}</span></td>
        <td class="r num">${c.n||'&mdash;'}</td>
        <td>${c.sectors.length?c.sectors.map(s=>`<span class="chip plain">${esc(s)}</span>`).join(' '):'<span style="color:var(--ink-faint)">not mapped</span>'}</td>
      </tr>`).join('')}</tbody></table></div></div>`;
}

function vCommittee(){
  const c=cmteById[S.cid]; if(!c) return empty('Not found','That committee is no longer in view.');
  const ms=filt(MEM.filter(m=>m.committees.some(x=>x.id===c.id)));
  const leads=ms.filter(m=>m.leadership.some(l=>l.id===c.id));
  const rest=ms.filter(m=>!leads.includes(m));
  return `<div class="fade-in">
    <button class="back" data-back="committees">&larr; All committees</button>
    <div class="dhead"><div><h1>${esc(short(c.name))}</h1><div class="dsub">${esc(c.name)}</div>
      <div class="chips">${c.sectors.length?c.sectors.map(s=>`<span class="chip acc" data-sec="${esc(s)}">${esc(s)}</span>`).join('')
        :'<span class="chip plain">No market-sector jurisdiction mapped</span>'}
        <span class="chip plain">${ms.length} members</span></div></div></div>
    ${leads.length?`<h2 class="sec">Leadership</h2><div class="egrid" style="margin-bottom:1.4rem">${leads.map(m=>card(m)).join('')}</div>`:''}
    <h2 class="sec">Members</h2>
    ${rest.length?`<div class="egrid">${rest.map(m=>card(m)).join('')}</div>`:empty('No members match','Widen the filters.')}
  </div>`;
}

function vMember(){
  const m=MEM.find(x=>x.id===S.mid); if(!m) return empty('Not found','That member is no longer in view.');
  return `<div class="fade-in">
    <button class="back" data-back="members">&larr; All members</button>
    <div class="dhead"><div>
      <h1><span class="pty ${P(m.party)}"></span>${esc(m.name)}</h1>
      <div class="dsub">${chamberName(m.chamber)} &middot; ${esc(m.party)} &middot; ${seat(m)}</div>
      <div class="chips"><span class="chip plain">In office since ${m.since}</span>
        <span class="chip plain">${YEAR-(+m.since)} years</span>
        ${m.leadership.map(l=>`<span class="chip acc">${esc(l.title)} &middot; ${esc(short(cmteById[l.id]?.name||''))}</span>`).join('')}</div>
    </div></div>
    <div class="two">
      <div style="display:flex;flex-direction:column;gap:1rem">
        <div class="panel"><h3>Committee assignments</h3>
          <p class="ph">Live rosters. Leadership roles are shown first &mdash; a chair sets the agenda, which is a stronger form of jurisdiction than membership.</p>
          ${m.committees.length?`<div class="clist">${m.committees.map(c=>{
            const lead=m.leadership.find(l=>l.id===c.id), full=cmteById[c.id];
            return `<button class="crow" data-cid="${c.id}">
              <span class="cn">${esc(short(c.name))}${lead?` <span class="chip acc" style="font-size:.58rem">${esc(lead.title)}</span>`:''}
                <span style="display:block;font-size:.71rem;color:var(--ink-faint)">${full&&full.sectors.length?full.sectors.map(esc).join(' &middot; '):'no market jurisdiction'}</span></span>
            </button>`;}).join('')}</div>`
            :`<p class="ph" style="margin:0">No standing committee assignments in the current Congress.</p>`}
        </div>
        <div class="panel"><h3>Trading record</h3>
          <p class="ph">Periodic Transaction Reports, filed under the STOCK Act.</p>
          <div class="pending"><div class="pt">Not ingested</div>
            <p>Disclosure filings for this member have not been loaded. The House Clerk, Senate EFD and SEC endpoints
            are blocked by this environment's network policy &mdash; see <strong>Data sources</strong> for exactly what is
            required. No estimated or placeholder figures are shown in their place.</p></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:1rem">
        <div class="panel"><h3>Sector jurisdiction</h3>
          <p class="ph">Market sectors this member's committees legislate over. Any future trade in these sectors is in-jurisdiction.</p>
          ${m.sectors.length?`<div class="clist">${m.sectors.map(s=>`<button class="crow" data-sec="${esc(s)}"><span class="cn">${esc(s)}</span><span class="num" style="font-size:.74rem;color:var(--ink-faint)">${sectorMembers(s).length} members</span></button>`).join('')}</div>`
            :`<p class="ph" style="margin:0">None. This member's committees carry no market-sector jurisdiction.</p>`}
        </div>
        <div class="panel"><h3>Record</h3>
          <div class="kv"><span class="k">Chamber</span><span class="v">${m.chamber==='sen'?'Senate':'House'}</span></div>
          <div class="kv"><span class="k">Seat</span><span class="v">${seat(m)}</span></div>
          <div class="kv"><span class="k">First took office</span><span class="v">${m.since}</span></div>
          <div class="kv"><span class="k">Committees</span><span class="v">${m.committees.length}</span></div>
          <div class="kv"><span class="k">Leadership roles</span><span class="v">${m.leadership.length}</span></div>
          <div class="kv"><span class="k">Bioguide ID</span><span class="v">${esc(m.id)}</span></div>
        </div>
      </div>
    </div></div>`;
}

function vSources(){
  const R=[
    ['Congressional roster','unitedstates/congress-legislators','live',`${MEM.length} sitting members &mdash; names, party, seat, tenure`],
    ['Committee rosters','unitedstates/congress-legislators','live',`${CMTE.length} committees, ${MEM.filter(m=>m.committees.length).length} members mapped`],
    ['Sector jurisdiction','derived','live',`${CMTE.filter(c=>c.sectors.length).length} committees mapped to ${SECTORS.length} GICS sectors`],
    ['House PTR filings','disclosures-clerk.house.gov','blocked','Transaction-level trades, ~45 day lag'],
    ['Senate PTR filings','efdsearch.senate.gov','blocked','Transaction-level trades, ~45 day lag'],
    ['Form 4 / 13F / 13D','data.sec.gov','blocked','Insider and institutional positions'],
    ['Price &amp; benchmark history','Yahoo Finance, NSE/BSE','blocked','Required for any return or alpha figure'],
    ['SEBI LODR Reg 31','nseindia.com, bseindia.com','blocked','India >1% holders &mdash; quarterly'],
  ];
  const badge={live:'<span class="chip live">&check; Live</span>',blocked:'<span class="chip blocked">&times; Egress blocked</span>'};
  return `<div class="rowgap fade-in">
    <div><h2 class="sec">Data sources</h2>
      <p class="sec-note">Exactly what is connected and what is not. Nothing in this app is estimated, sampled or filled in &mdash; a figure is either sourced or absent.</p>
      <div class="tw"><table><thead><tr><th>Dataset</th><th>Source</th><th>Status</th><th>Provides</th></tr></thead>
        <tbody>${R.map(([n,s,st,p])=>`<tr><td><span class="ename">${n}</span></td>
          <td class="num" style="font-size:.76rem;color:var(--ink-soft)">${s}</td>
          <td>${badge[st]}</td><td style="font-size:.79rem;color:var(--ink-soft)">${p}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="note warn"><b>Why the trade data is missing</b>
      <p>This build runs in a sandbox whose egress policy permits GitHub and blocks everything else. The congressional
      roster and committee rosters are served from a public GitHub dataset, which is why they are complete and real.
      The disclosure endpoints &mdash; House Clerk, Senate EFD, SEC EDGAR &mdash; return <code>403</code> at the proxy, so no
      transaction data could be loaded.</p>
      <p>Rather than fill those columns with invented numbers, every trade-derived metric reports its absence. Allowing
      egress to the four blocked hosts above is the only change needed: the ingestion and scoring layers read from the
      same schema this roster already uses.</p></div>
    <div class="note"><b>On the analytics that follow</b>
      <p>Once filings load, each is classified in- or out-of-jurisdiction using the sector map on this page, and scored
      on residual alpha &mdash; the abnormal return still available after the disclosure lag, which is the only part anyone
      outside Congress could act on. Rankings carry false-discovery-rate correction, because with ${MEM.length} members
      being ranked at once, some will look skilled purely by chance.</p></div>
  </div>`;
}

const empty=(t,p)=>`<div class="panel" style="text-align:center;padding:2.4rem 1rem"><div class="mono" style="color:var(--ink-soft);margin-bottom:.3rem">${esc(t)}</div><p style="font-size:.82rem;color:var(--ink-faint);margin:0">${esc(p)}</p></div>`;

function render(){
  chrome();
  app.innerHTML = {sectors:vSectors,sector:vSector,members:vMembers,member:vMember,
                   committees:vCommittees,committee:vCommittee,sources:vSources}[S.view]();
  app.insertAdjacentHTML('beforeend',`<div class="foot">Ledger &amp; Signal &mdash; congressional jurisdiction index.<br>
    Roster and committee data from the public-domain <span style="color:var(--ink-soft)">unitedstates/congress-legislators</span> dataset.
    Trade-derived metrics are unpopulated by design; see Data sources.</div>`);
  scrollTo({top:0,behavior:'instant'});
}
addEventListener('click',e=>{
  const g=(k)=>e.target.closest(`[data-${k}]`);
  let n;
  if(n=g('ch')){S.ch=n.dataset.ch; if(S.view==='member')S.view='members'; return render();}
  if(n=g('pt')){S.pt=n.dataset.pt; if(S.view==='member')S.view='members'; return render();}
  if(n=g('tab')){S.view=n.dataset.tab; return render();}
  if(n=g('back')){S.view=n.dataset.back; return render();}
  if(n=g('mid')){S.mid=n.dataset.mid;S.view='member'; return render();}
  if(n=g('sec')){S.sec=n.dataset.sec;S.view='sector'; return render();}
  if(n=g('cid')){S.cid=n.dataset.cid;S.view='committee'; return render();}
});
addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const r=e.target.closest('tr.clickable'); if(!r)return; e.preventDefault(); r.click();
});
let qt; q.addEventListener('input',e=>{const v=e.target.value;clearTimeout(qt);
  qt=setTimeout(()=>{S.q=v; if(S.view==='member')S.view='members'; render(); q.value=v; q.focus();},140);});
render();
</script>
